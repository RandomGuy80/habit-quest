<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </radialGradient>

    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#0A0A1A"/>
    </linearGradient>

    <!-- Neon purple glow filter -->
    <filter id="purpleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon cyan glow filter -->
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner text glow -->
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow for whole icon -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Subtle scanlines -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"
    fill="url(#scanlines)" opacity="0.04"/>

  <!-- Outer glow ring -->
  <rect x="20" y="20" width="984" height="984" rx="205" ry="205"
    fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.4"
    filter="url(#purpleGlow)"/>

  <!-- Shield shape (clipped to rounded square) -->
  <g clip-path="url(#roundedClip)">

    <!-- Shield glow backdrop -->
    <path d="M512 160 L760 240 L760 520 Q760 700 512 860 Q264 700 264 520 L264 240 Z"
      fill="#7C3AED" opacity="0.15" filter="url(#purpleGlow)"/>

    <!-- Shield main body -->
    <path d="M512 175 L748 252 L748 515 Q748 688 512 845 Q276 688 276 515 L276 252 Z"
      fill="url(#shieldGrad)"
      stroke="#A78BFA" stroke-width="3" opacity="0.95"/>

    <!-- Shield inner border neon -->
    <path d="M512 205 L722 272 L722 510 Q722 666 512 812 Q302 666 302 510 L302 272 Z"
      fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.5"/>

    <!-- Diagonal scan line accent inside shield -->
    <line x1="310" y1="540" x2="714" y2="280" stroke="#00F5FF" stroke-width="1" opacity="0.12"/>
    <line x1="310" y1="600" x2="714" y2="340" stroke="#00F5FF" stroke-width="1" opacity="0.08"/>
    <line x1="310" y1="480" x2="714" y2="220" stroke="#00F5FF" stroke-width="1" opacity="0.08"/>

    <!-- HQ letters -->
    <!-- H letter -->
    <text x="390" y="590"
      font-family="Arial Black, Impact, sans-serif"
      font-size="240" font-weight="900"
      fill="#FFFFFF" filter="url(#textGlow)"
      text-anchor="middle">H</text>

    <!-- Q letter -->
    <text x="640" y="590"
      font-family="Arial Black, Impact, sans-serif"
      font-size="240" font-weight="900"
      fill="#00F5FF" filter="url(#textGlow)"
      text-anchor="middle">Q</text>

    <!-- Separator line between H and Q -->
    <line x1="510" y1="360" x2="510" y2="610"
      stroke="#A78BFA" stroke-width="3" opacity="0.6"/>

    <!-- Top shield notch accent -->
    <path d="M460 200 L512 175 L564 200 L550 230 L512 215 L474 230 Z"
      fill="#00F5FF" opacity="0.7" filter="url(#cyanGlow)"/>

  </g>

  <!-- Cyan corner accents (top-left, top-right) -->
  <line x1="80" y1="200" x2="80" y2="120" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="160" y2="120" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

  <line x1="944" y1="200" x2="944" y2="120" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  <line x1="944" y1="120" x2="864" y2="120" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

  <line x1="80" y1="824" x2="80" y2="904" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  <line x1="80" y1="904" x2="160" y2="904" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

  <line x1="944" y1="824" x2="944" y2="904" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  <line x1="944" y1="904" x2="864" y2="904" stroke="#00F5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

  <!-- Bottom label -->
  <text x="512" y="960"
    font-family="Arial Narrow, Arial, sans-serif"
    font-size="52" font-weight="700" letter-spacing="14"
    fill="#A78BFA" text-anchor="middle" opacity="0.7">HABITQUEST</text>

</svg>
